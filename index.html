<!DOCTYPE html>
<html>
  <head>
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>Recicla Solar Coca-Cola</title>
    <link rel="stylesheet" href="css/index.css">
  </head>
  <body>
    <div class="game-intro" id="video">
      <video autoplay muted playsinline controls loop width="1920" height="1080" id="vid">
        <source src="intro.mp4" type="video/mp4">
        Seu navegador não suporta o elemento de vídeo.
      </video>
    </div>

    <div class="game-tutorial" id="game-tutorial" hidden>
      <img src="img/bg_tutorial.png" alt="" width="1920" height="1080">
    </div>

    <div class="game-play" id="game-play" width="1920" height="1080" hidden>
      <div class="game-board">
        <div class="game-life" id="life">
          <img src="img/life3.png" alt="" width="285px" height="285px" id="life3">
          <img src="img/life2.png" alt="" width="285px" height="285px" id="life2" hidden>
          <img src="img/life1.png" alt="" width="285px" height="285px" id="life1" hidden>
          <img src="img/life0.png" alt="" width="285px" height="285px" id="life0" hidden>
        </div>
        <div class="game-tile" id="tile-1" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-2" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-3" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-4" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-5" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-6" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
        <div class="game-tile" id="tile-7" ondrop="drop(event)" ondragover="allowDrop(event)"></div>
      </div>
      <div class="game-stack">
        <img class="card" id="card-1" draggable="true" ondragstart="drag(event)" src="img/card_agregadores.png">
        <img class="card" id="card-2" draggable="true" ondragstart="drag(event)" src="img/card_coleta.png">
        <img class="card" id="card-3" draggable="true" ondragstart="drag(event)" src="img/card_consumo.png">
        <img class="card" id="card-4" draggable="true" ondragstart="drag(event)" src="img/card_cooperativa.png">
        <img class="card" id="card-5" draggable="true" ondragstart="drag(event)" src="img/card_industria.png">
        <img class="card" id="card-6" draggable="true" ondragstart="drag(event)" src="img/card_producao.png">
        <img class="card" id="card-7" draggable="true" ondragstart="drag(event)" src="img/card_venda.png">
      </div>
    </div>

    <div class="game-game-over" id="game-game-over" hidden>
      <img src="img/bg_game_over.png" width="1920" height="1080" alt="">
    </div>

    <div class="game-final" id="game-final" hidden>
      <img src="img/bg_final.png" width="1920" height="1080" alt="">
    </div>
    <script src="js/index.js"></script>
  </body>
</html>
